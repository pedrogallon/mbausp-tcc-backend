spring:
  application:
    name: backend
  profiles:
    active: request
logging:
  pattern:
    console: "%d{HH:mm:ss} %clr(%5p){cyan} %clr(%c{1}){magenta} - %m%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles:
        tcc.requests.processing.time: 0.5,0.95,0.99
        tcc.events.processing.time: 0.5,0.95,0.99
      percentile-histogram:
        tcc.requests.processing.time: true
        tcc.events.processing.time: true
    export:
      cloudwatch:
        enabled: true
        namespace: BackendRequest
        step: 1m

aws:
  region: sa-east-1

app:
  mode: request
  processing:
    cpu-passes: 6
    enrichment-rounds: 150
